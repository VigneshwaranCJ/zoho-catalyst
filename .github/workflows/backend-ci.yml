name: backend-ci

on:
  push:
    paths: ["backend/**", "docker/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "docker/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: csp
          POSTGRES_USER: csp_owner
          POSTGRES_PASSWORD: ci_owner_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U csp_owner -d csp"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      # CI-only throwaway values (the database lives only for this job).
      APP_ENV: test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      POSTGRES_DB: csp
      POSTGRES_OWNER_USER: csp_owner
      POSTGRES_OWNER_PASSWORD: ci_owner_password
      POSTGRES_APP_USER: csp_app
      POSTGRES_APP_PASSWORD: ci_app_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      TEST_REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: uv sync --frozen

      - name: Create app role and test database (same script Docker uses)
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: ci_owner_password
          POSTGRES_USER: csp_owner
        run: bash docker/postgres/init/01-roles.sh

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type-check
        run: uv run mypy app scripts

      - name: Tests
        run: uv run pytest -q
